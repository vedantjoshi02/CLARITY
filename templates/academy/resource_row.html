<div class="resource-row"><span class="file-icon {% if resource.kind == 'pyp' %}peach{% endif %}">▤</span><div class="resource-info"><a href="{% url 'resource_detail' resource.pk %}">{{ resource.title }}</a><p>{{ resource.subject.name }} <span>·</span> {{ resource.get_kind_display }} <span>·</span> {{ resource.file_format }}</p></div><span class="resource-date">{{ resource.created_at|date:'d M Y' }}</span>{% if user.is_superuser %}<span class="badge-soft">{{ resource.get_status_display }}{% if not resource.approved %} · Draft{% endif %}</span>{% endif %}<a class="icon-button" href="{% url 'download' resource.pk %}" aria-label="Download {{ resource.title }}">↓</a></div>
