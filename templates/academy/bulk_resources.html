{% extends 'base.html' %}
{% block breadcrumb %}Bulk upload{% endblock %}
{% block content %}
<div class="page-heading">
  <div><h1>Bulk resource upload</h1><p>Files share the selected classification. Each file enters the review queue with its filename as the title.</p></div>
  <a class="button outline" href="{% url 'review_resources' %}">Open review queue</a>
</div>
<div class="panel padded form-panel">
  <form method="post" enctype="multipart/form-data" class="stack-form">
    {% csrf_token %}{{ form.as_p }}
    <button class="button" data-loading="Uploading…">Upload drafts</button>
  </form>
</div>
{% endblock %}
