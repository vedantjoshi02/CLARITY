<a class="subject-card color-{% cycle 'green' 'blue' 'peach' 'lilac' %}" href="{% url 'subject_resources' subject.pk %}"><div class="card-top"><span class="subject-icon">{% cycle '⌘' '▧' '⌁' '∑' %}</span><span class="subject-code">{{ subject.code }}</span></div><span class="eyebrow">SEMESTER {{ subject.semester.number }}</span><h3>{{ subject.name }}</h3><p>{{ subject.description|default:'Explore your notes, papers, and essential concepts.'|truncatechars:85 }}</p><div class="card-bottom"><span>{{ subject.resource_count }} resource{{ subject.resource_count|pluralize }}</span><span>→</span></div></a>
